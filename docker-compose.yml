# ============================================================================
# Docker Compose - Galactic Tournament API
# Services: PostgreSQL 16 + Java API
# ============================================================================

services:
  # =========================================================================
  # PostgreSQL Database Service
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: galactic-postgres
    hostname: postgres

    # Environment variables for PostgreSQL
    environment:
      POSTGRES_DB: galactic_tournament
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tournament_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=en_US.UTF-8 --lc-ctype=en_US.UTF-8"
      TZ: UTC

    # Port mapping
    ports:
      - "${DB_PORT:-5432}:5432"

    # Volume for database initialization and persistence
    volumes:
      # DDL initialization script
      - ./ddl/01-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Data persistence
      - postgres_data:/var/lib/postgresql/data

    # Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d galactic_tournament"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Restart policy
    restart: unless-stopped

    # Network
    networks:
      - galactic-network

    # Common settings
    command: postgres

  # =========================================================================
  # Java Application Service
  # =========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: galactic-api
    hostname: api

    # Depends on PostgreSQL health check
    depends_on:
      postgres:
        condition: service_healthy

    # Port mapping (API)
    ports:
      - "${API_PORT:-8080}:8080"

    # Environment variables for the application
    environment:
      # Database connection
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/galactic_tournament
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-tournament_password}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      # JPA/Hibernate
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"

      # Application specific
      SPRING_APPLICATION_NAME: galactic-tournament-api
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200,http://localhost:5173}
      API_KEYS: ${API_KEYS:-test-key-123,test-key-456,dev-api-key}

      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_TECHNICALTESTS_MV: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO

      # Java options
      JAVA_OPTS: -Xmx512m -Xms256m -XX:+UseG1GC

    # Volumes for configuration and logs
    volumes:
      # Application logs
      - ./logs:/app/logs
      # Configuration override (optional)
      - ./config/application.yaml:/app/config:ro

    # Health check
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - -H
        - "X-API-Key: test-key-123"
        - http://localhost:8080/api/swagger-ui.html
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Restart policy
    restart: unless-stopped

    # Network
    networks:
      - galactic-network

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================================================
# Networks
# ============================================================================
networks:
  galactic-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    driver: local










